name: Portrait hero preview

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply portrait hero design
        shell: python
        run: |
          from pathlib import Path
          p=Path('website/index.html')
          s=p.read_text()
          old='<section class="hero"><video class="heroVideo" autoplay muted loop playsinline preload="metadata" poster="../projects/NAE-001.jpg" aria-label="Northern Alliance Electric project video"><source src="VID_20260727_034531_448.mp4" type="video/mp4"></video><div class="shade"></div><div class="heroCopy">'
          new='<section class="hero portraitHero"><div class="heroBackdrop"><video autoplay muted loop playsinline preload="metadata" aria-hidden="true"><source src="VID_20260727_034531_448.mp4" type="video/mp4"></video></div><div class="heroPhoneFrame"><video class="heroPhoneVideo" autoplay muted loop playsinline preload="metadata" poster="../projects/NAE-001.jpg" aria-label="Northern Alliance Electric project video"><source src="VID_20260727_034531_448.mp4" type="video/mp4"></video></div><div class="shade"></div><div class="heroCopy">'
          if old in s:s=s.replace(old,new,1)
          css='.portraitHero{isolation:isolate;min-height:820px;perspective:1200px}.heroBackdrop{position:absolute;inset:-7%;z-index:0;overflow:hidden}.heroBackdrop video{width:100%;height:100%;object-fit:cover;filter:blur(34px) brightness(.38) saturate(.82);transform:scale(1.16);animation:portraitBackdropZoom 18s ease-in-out infinite alternate}.heroPhoneFrame{position:absolute;z-index:1;right:8%;top:50%;width:min(31vw,390px);aspect-ratio:9/16;transform:translateY(-50%);border-radius:30px;overflow:hidden;border:1px solid rgba(255,255,255,.26);background:#050505;box-shadow:0 34px 90px rgba(0,0,0,.72),0 0 55px rgba(255,210,26,.12);transition:width .2s linear,border-radius .2s linear,right .2s linear}.heroPhoneFrame:before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(120deg,rgba(255,255,255,.18),transparent 24%,transparent 72%,rgba(255,210,26,.08));mix-blend-mode:screen}.heroPhoneVideo{width:100%;height:100%;object-fit:cover;display:block}.portraitHero .shade{z-index:2;background:linear-gradient(90deg,#000 0%,rgba(0,0,0,.94) 37%,rgba(0,0,0,.55) 62%,rgba(0,0,0,.4))}.portraitHero .heroCopy{z-index:3;max-width:770px}@keyframes portraitBackdropZoom{from{transform:scale(1.14)}to{transform:scale(1.23)}}@media(max-width:980px){.heroPhoneFrame{right:4%;width:min(38vw,350px)}.portraitHero .heroCopy{max-width:62%}}@media(max-width:700px){.portraitHero{min-height:880px;align-items:flex-start}.heroPhoneFrame{right:50%;top:auto;bottom:32px;transform:translateX(50%);width:220px;border-radius:22px}.portraitHero .heroCopy{max-width:none;padding-top:72px;padding-bottom:430px;text-align:left}.portraitHero .shade{background:linear-gradient(180deg,#000 0%,rgba(0,0,0,.88) 52%,rgba(0,0,0,.42) 100%)}}'
          marker='@media(max-width:980px)'
          if '.portraitHero{isolation:isolate' not in s:s=s.replace(marker,css+marker,1)
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add cinematic portrait hero preview"
          git push
