name: Expand website service area

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/expand-service-area.yml'

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update service area section
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('website/index.html')
          html = path.read_text(encoding='utf-8')

          replacement = '''<section class="areas reveal"><div class="areasWrap"><div><div class="eyebrow">Service area</div><h2>Serving communities within approximately two hours of Bolton.</h2><p>Our crews support residential, commercial and construction projects across the Greater Toronto Area and surrounding Southern Ontario communities. Travel availability may vary by project size, scheduling and location.</p><div class="areaList"><span>Bolton & Caledon</span><span>Orangeville & Shelburne</span><span>Alliston & New Tecumseth</span><span>Vaughan & Richmond Hill</span><span>Newmarket & Aurora</span><span>Barrie & Innisfil</span><span>Toronto & North York</span><span>Markham & Scarborough</span><span>Brampton & Mississauga</span><span>Milton & Oakville</span><span>Burlington & Hamilton</span><span>Guelph & Cambridge</span><span>Kitchener-Waterloo</span><span>Pickering, Ajax & Whitby</span></div></div><div class="areaMap" aria-label="Northern Alliance Electric service area across Southern Ontario"><div class="dot" style="left:33%;top:34%"><span>Barrie</span></div><div class="dot" style="left:28%;top:48%"><span>Orangeville</span></div><div class="dot" style="left:40%;top:50%"><span>Bolton</span></div><div class="dot" style="left:48%;top:45%"><span>Newmarket</span></div><div class="dot" style="left:47%;top:58%"><span>Vaughan</span></div><div class="dot" style="left:38%;top:64%"><span>Brampton</span></div><div class="dot" style="left:51%;top:69%"><span>Toronto</span></div><div class="dot" style="left:61%;top:61%"><span>Markham</span></div><div class="dot" style="left:31%;top:73%"><span>Mississauga</span></div><div class="dot" style="left:22%;top:79%"><span>Oakville</span></div><div class="dot" style="left:12%;top:71%"><span>Guelph</span></div><div class="dot" style="left:14%;top:87%"><span>Hamilton</span></div></div></div></section>'''

          updated, count = re.subn(r'<section class="areas(?: reveal)?">.*?</section>', replacement, html, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Expected one service-area section, found {count}')

          path.write_text(updated, encoding='utf-8')
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/expand-service-area.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/index.html .github/workflows/expand-service-area.yml
          git commit -m "Expand website service area to two hours from Bolton"
          git push
